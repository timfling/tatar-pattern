# Dedicated rsyslog process, no default host logs or networking.
global(workDirectory="/run/tatar-pattern-logs")
module(load="imuxsock" SysSock.Use="off")
template(name="TPFile" type="string" string="/var/log/tatar-pattern/runtime-%$YEAR%-%$MONTH%-%$DAY%.log")
template(name="TPLine" type="string" string="%timegenerated:::date-rfc3339% %app-name% %msg:::drop-last-lf%\n")
ruleset(name="TP") {
  action(type="omfile" dynaFile="TPFile" template="TPLine" fileCreateMode="0600" dirCreateMode="0700")
}
input(type="imuxsock" Socket="/run/tatar-pattern-logs/syslog" CreatePath="on" ruleset="TP")
