x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  restart: unless-stopped
  logging: *logs
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: tp
      POSTGRES_DB: tatar_pattern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ${DATA_ROOT:?required}/postgres:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tp -d tatar_pattern']
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    <<: *app
    image: tatar-pattern-backend:${RELEASE:?required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://tp:${POSTGRES_PASSWORD}@db:5432/tatar_pattern
      STORAGE_ROOT: /data/storage
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${DOMAIN:?required}
      ALLOW_FIXTURES: "false"
      TP_ENVIRONMENT: production
      SESSION_DAYS: "7"
      PUBLIC_GUEST_MODE: "true"
      GUEST_TTL_SECONDS: "86400"
      GUEST_GPU_BUDGET: "0"
    volumes:
      - ${DATA_ROOT}/storage:/data/storage
      - ${DATA_ROOT}/migration-backups:/app/db/backups
    depends_on:
      db: {condition: service_healthy}
    command: [uvicorn, "app.main:create_app", --factory, --host, "0.0.0.0", --port, "8000", --workers, "1", --proxy-headers, --forwarded-allow-ips, "${PROXY_IP:-172.29.86.10}", --no-access-log]
    networks: [edge, data]
    mem_limit: 1g
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  ai-worker:
    <<: *app
    profiles: [ai]
    image: tatar-pattern-backend:${RELEASE}
    # Opt-in process; no automatic restart after an uncertain failure.
    restart: "no"
    env_file:
      - path: ${AI_PROVIDER_ENV_FILE:-/etc/tatar-pattern/ai-provider.env}
        required: false
    environment:
      DATABASE_URL: postgresql://tp:${POSTGRES_PASSWORD}@db:5432/tatar_pattern
      STORAGE_ROOT: /data/storage
      TP_ENVIRONMENT: production
      ALLOW_FIXTURES: "false"
      PUBLIC_GUEST_MODE: "true"
      COOKIE_SECURE: "true"
      GUEST_TTL_SECONDS: "86400"
      GUEST_GPU_BUDGET: "0"
      AI_MVP_ENABLED: "false"
      # Names accepted in the backend handoff; file-only Bearer source.
      AI_GPU_BASE_URL: http://gpu-tunnel:18765
      AI_GPU_TOKEN_FILE: /run/secrets/gpu_bearer
      AI_GPU_TOKEN: ""
      AI_GPU_HTTP_PROOF_FILE: /data/storage/ai-gpu-worker-proof.json
      GPU_EXPECTED_WORKFLOW_VERSION: ${GPU_EXPECTED_WORKFLOW_VERSION:-tp-sdxl-composition-img2img/1.0.0}
      GPU_EXPECTED_MODEL_VERSION: ${GPU_EXPECTED_MODEL_VERSION:-378c08ff157660a3399573e1cd5918ad8f3aec344646c5336b027d63fe50ca42}
    command: [python, -m, scripts.ai_worker]
    volumes:
      - ${DATA_ROOT}/storage:/data/storage
      - ./ai-readiness.py:/opt/deploy/ai-readiness.py:ro
      - type: bind
        source: ${GPU_BEARER_FILE:-/etc/tatar-pattern/gpu/bearer}
        target: /run/secrets/gpu_bearer
        read_only: true
        bind: {create_host_path: false}
    networks: [data, gpu-link]
    depends_on:
      db: {condition: service_healthy}
      gpu-tunnel: {condition: service_healthy}
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    stop_signal: SIGTERM
    stop_grace_period: 960s
  gpu-tunnel:
    <<: *app
    profiles: [ai]
    image: tatar-pattern-tunnel:${RELEASE}
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    user: "10001:10001"
    environment:
      GPU_SSH_HOST: ${GPU_SSH_HOST:-NOT_CONFIGURED.invalid}
      GPU_SSH_PORT: ${GPU_SSH_PORT:-22}
      GPU_SSH_USER: ${GPU_SSH_USER:-tunnel}
      # Agreed target GPU host endpoint; runtime remains unverified.
      GPU_API_PORT: ${GPU_API_PORT:-8765}
    volumes:
      - type: bind
        source: ${GPU_SSH_KEY_FILE:-/etc/tatar-pattern/gpu/id_ed25519}
        target: /run/ssh/id_ed25519
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GPU_KNOWN_HOSTS_FILE:-/etc/tatar-pattern/gpu/known_hosts}
        target: /run/ssh/known_hosts
        read_only: true
        bind: {create_host_path: false}
    networks: [gpu-link, gpu-egress]
    # No published ports. Binding 0.0.0.0 is confined to this container.
    mem_limit: 96m
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    healthcheck:
      # Listener only; not a claim of GPU HTTP readiness.
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',18765),3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    <<: *app
    image: tatar-pattern-frontend:${RELEASE}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [edge]
    mem_limit: 768m
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=128m,uid=1000,gid=1000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  proxy:
    <<: *app
    profiles: [public]
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT}/caddy-data:/data
      - ${DATA_ROOT}/caddy-config:/config
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-172.29.86.10}
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    mem_limit: 128m
    # Caddy image runs as root but has no capabilities except binding low ports.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.29.86.0/24}
  gpu-link:
    internal: true
  gpu-egress: {}
  data:
    internal: true
