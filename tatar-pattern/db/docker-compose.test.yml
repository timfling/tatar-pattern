# Independent test server. No mounts or references to the working DB or volumes.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tp_test
      POSTGRES_DB: tatar_pattern_backend_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TP_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp_test -d tatar_pattern_backend_test"]
      interval: 2s
      timeout: 3s
      retries: 30
