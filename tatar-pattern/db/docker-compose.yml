# Working PostgreSQL. Existing named volume is preserved.
# Apply migrations explicitly with backend/scripts/migrate.py after its backup.
services:
  db:
    image: postgres:16
    container_name: tatar-pattern-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tatar_pattern_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer:4
    container_name: tatar-pattern-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
volumes:
  tatar_pattern_pgdata:
